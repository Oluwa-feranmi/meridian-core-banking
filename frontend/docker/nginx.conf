server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets — meaningfully reduces transfer size for the JS bundle
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively (Vite fingerprints filenames,
    # so a new deploy naturally gets new URLs — safe to cache forever).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing (react-router): any path that isn't a real file
    # falls back to index.html so deep links like /customers/<id> work on
    # a hard refresh instead of hitting nginx's default 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Lightweight endpoint for the container health check below —
    # distinct from the backend's /health/* API endpoints.
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
